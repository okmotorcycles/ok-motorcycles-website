<!doctype html><meta charset="utf-8"><pre id="out" style="font:12px monospace"></pre>
<iframe id="f" src="index.html" style="border:0"></iframe>
<script>
const p=new URLSearchParams(location.search);
const f=document.getElementById("f"); f.width=p.get("w"); f.height=p.get("h");
const wait=ms=>new Promise(r=>setTimeout(r,ms));
f.addEventListener("load",async()=>{
  const w=f.contentWindow,d=w.document;
  await wait(900);
  const b=d.querySelector(".board").getBoundingClientRect();
  const vw=w.innerWidth;
  const offLeft=Math.max(0,-b.left), offRight=Math.max(0,b.right-vw);
  document.getElementById("out").textContent=JSON.stringify({
    size:`${p.get("w")}x${p.get("h")}`, viewportW:vw,
    boardW:+b.width.toFixed(1), left:+b.left.toFixed(1), right:+b.right.toFixed(1),
    clippedPct:+(((offLeft+offRight)/b.width)*100).toFixed(1),
    fit:d.querySelector(".stage").style.getPropertyValue("--fit"),
  },null,1);
  document.title="done";
});
</script>
