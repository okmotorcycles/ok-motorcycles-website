<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/images/favicon-96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/favicon-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/assets/css/main.css">
    {% seo %}
    <script>/* apply saved theme before paint to avoid a flash; light is default */
      try { if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme','dark'); } catch (e) {}
    </script>
  </head>
  <body class="{% if page.url == '/' %}is-home{% endif %}">
    <div class="hwy-app">
      {% include header.html %}
      <div class="hwy-body">
        <main class="roadway">
          <div class="roadway__inner">
            {{ content }}
          </div>
        </main>
      </div>
      {% include footer.html %}
    </div>
    {% include notes-index.html %}
    <div class="note-preview" id="note-preview" hidden></div>
    <script src="/assets/js/garden.js"></script>
    <script src="/assets/js/moto-parallax.js" defer></script>
  </body>
</html>
